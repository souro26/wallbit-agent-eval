name: Agent Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd web && npm ci && cd ..

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: |
          npm run lint
          npm run web:lint

      - name: Build
        run: |
          npm run build
          npm run web:build

      - name: Run tests
        run: npm test

      - name: Run evaluation
        run: node dist/cli.js run --scenario trade-happy-path --junit evaluation-report.xml

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-report
          path: evaluation-report.xml
          retention-days: 7